<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="theme-color" content="#071018">
  <title>Comics Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">📖 <strong>Comics Reader</strong></div>
    <div class="header-actions">
      <button id="helpButton" type="button" aria-expanded="false">Aide</button>
      <button id="fullscreenButton" type="button">Plein écran</button>
    </div>
  </header>

  <main class="app-shell">
    <section class="selectors" aria-label="Choix de lecture">
      <label><span>Tome</span><select id="volumeSelect"><option>Tome 1</option></select></label>
      <label><span>Planche</span><select id="pageSelect"><option>Planche 1</option></select></label>
    </section>

    <section class="reader-card" aria-label="Lecteur de bande dessinée">
      <div class="panel-stage" id="panelStage" tabindex="0" aria-live="polite">
        <div class="empty-state" id="emptyState" hidden><strong>Aucune planche disponible</strong></div>
        <img id="panelImage" alt="" hidden draggable="false">
      </div>

      <div class="progress-block">
        <span id="progressLabel">Case 0 sur 0</span>
        <progress id="progressBar" max="1" value="0"></progress>
      </div>

      <nav class="controls" aria-label="Navigation entre les cases">
        <button id="previousButton" type="button" class="nav-button">←<span>Précédente</span></button>
        <button id="pageButton" type="button" class="compact-button">▦<span>Voir la planche</span></button>
        <button id="fitButton" type="button" class="compact-button">☷<span>Ajuster</span></button>
        <button id="nextButton" type="button" class="nav-button primary">→<span>Suivante</span></button>
      </nav>
    </section>

    <section class="zoom-panel" aria-label="Réglage du zoom">
      <span>Zoom</span>
      <button id="zoomOutButton" type="button" aria-label="Dézoomer">−</button>
      <input id="zoomRange" type="range" min="100" max="400" step="10" value="100" aria-label="Zoom">
      <button id="zoomInButton" type="button" aria-label="Zoomer">+</button>
      <output id="zoomValue">100%</output>
      <small>Pincez avec deux doigts pour zoomer</small>
    </section>

    <aside id="helpPanel" class="help-panel" hidden>
      <h2>Commandes</h2>
      <p>Balayez horizontalement ou utilisez les boutons pour changer de case.</p>
      <p>Pincez avec deux doigts pour zoomer et glissez pour déplacer l’image.</p>
    </aside>
  </main>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button class="active">⌂<span>Lecture</span></button>
    <button>☷<span>Sommaire</span></button>
    <button>♡<span>Marque-pages</span></button>
    <button>⚙<span>Paramètres</span></button>
  </nav>

  <script src="comics.js"></script>
  <script src="app.js"></script>
</body>
</html>
