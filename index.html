<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
  <meta name="theme-color" content="#071018">
  <title>Fantasmes – Tome 3 – Les Jeux interdits</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">📖 <strong id="comicTitle">Fantasmes – Tome 3 – Les Jeux interdits</strong></div>
    <div class="header-actions">
      <button id="helpButton" type="button" aria-expanded="false">Aide</button>
      <button id="fullscreenButton" type="button">Plein écran</button>
    </div>
  </header>

  <main class="app-shell">
    <section class="reader-card" aria-label="Lecteur PDF">
      <div class="panel-stage pdf-mode" id="panelStage" tabindex="0">
        <div class="empty-state" id="emptyState"><strong>Chargement du PDF…</strong></div>
        <canvas id="pdfCanvas" hidden></canvas>
      </div>

      <div class="pdf-status">
        <button id="previousButton" type="button" aria-label="Page précédente">←</button>
        <label>Page <input id="pageNumber" type="number" min="1" value="1" inputmode="numeric"> / <span id="pageCount">0</span></label>
        <button id="nextButton" type="button" aria-label="Page suivante">→</button>
      </div>

      <div class="pdf-toolbar">
        <button id="zoomOutButton" type="button" aria-label="Dézoomer">−</button>
        <input id="zoomRange" type="range" min="50" max="300" step="10" value="100" aria-label="Zoom">
        <button id="zoomInButton" type="button" aria-label="Zoomer">+</button>
        <output id="zoomValue">100%</output>
        <button id="fitButton" type="button">Ajuster</button>
      </div>
    </section>

    <aside id="helpPanel" class="help-panel" hidden>
      <h2>Commandes</h2>
      <p>Utilisez les flèches ou les boutons pour changer de planche.</p>
      <p>Utilisez +, − ou le curseur pour zoomer. Le bouton Ajuster adapte la page à l’écran.</p>
      <p>La touche F active ou quitte le plein écran.</p>
    </aside>
  </main>

  <nav class="bottom-nav" aria-label="Navigation principale">
    <button class="active">⌂<span>Lecture</span></button>
    <button>☷<span>Sommaire</span></button>
    <button>♡<span>Marque-pages</span></button>
    <button>⚙<span>Paramètres</span></button>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
