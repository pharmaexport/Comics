<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5,user-scalable=yes">
  <meta name="theme-color" content="#02060d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Comics Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Navigation">
      <div class="logo">VK<span>omic</span></div>
      <nav class="side-nav">
        <button class="nav-item active" data-view="reader">◉<span>Lecture</span></button>
        <button class="nav-item" data-view="library">▦<span>Bibliothèque</span></button>
        <button class="nav-item" data-view="bookmarks">♡<span>Marque-pages</span></button>
        <button class="nav-item" data-view="settings">⚙<span>Paramètres</span></button>
      </nav>
    </aside>

    <div class="content-shell">
      <header class="topbar reader-chrome" id="topbar">
        <button id="backButton" class="icon-button" type="button" aria-label="Retour à la bibliothèque">←</button>
        <strong id="comicTitle">Comics Reader</strong>
        <div class="top-actions">
          <button id="bookmarkButton" class="icon-button" type="button" aria-pressed="false">♡</button>
          <button id="fullscreenButton" type="button">Plein écran</button>
        </div>
      </header>

      <main class="main-content">
        <section id="readerView" class="view active-view">
          <div class="immersive-reader" id="immersiveReader">
            <div class="panel-stage" id="panelStage" tabindex="0" aria-label="Lecteur de document">
              <div class="empty-state" id="emptyState"><strong>Chargement du document…</strong></div>
              <canvas id="pdfCanvas" hidden></canvas>
              <div id="epubViewer" hidden></div>
            </div>

            <div class="reader-overlay reader-chrome" id="readerControls">
              <button id="previousButton" type="button" class="round-button" aria-label="Page précédente">←</button>
              <div class="page-control">
                <div><span id="positionLabel">Page</span> <input id="pageNumber" type="number" min="1" value="1" inputmode="numeric"> <span>sur <b id="pageCount">0</b></span></div>
                <input id="pageSlider" type="range" min="1" max="1" value="1" aria-label="Progression">
              </div>
              <button id="nextButton" type="button" class="round-button primary" aria-label="Page suivante">→</button>
            </div>

            <div class="zoom-dock reader-chrome" id="zoomDock">
              <button id="zoomOutButton" type="button" aria-label="Réduire">−</button>
              <input id="zoomRange" type="range" min="25" max="400" step="5" value="100" aria-label="Zoom ou taille du texte">
              <button id="zoomInButton" type="button" aria-label="Agrandir">+</button>
              <output id="zoomValue">100%</output>
              <button id="fitButton" type="button">Ajuster à la largeur</button>
            </div>
          </div>
        </section>

        <section id="libraryView" class="view">
          <div class="section-heading"><div><small>COLLECTION</small><h1>Bibliothèque</h1></div><input id="librarySearch" type="search" placeholder="Rechercher une BD…"></div>
          <div class="source-loader">
            <label><span>Ouvrir depuis une adresse PDF ou EPUB</span><div><input id="sourceUrl" type="url" placeholder="https://…/livre.epub"><button id="openUrlButton" type="button">Ouvrir</button></div></label>
            <label class="file-button">Choisir un fichier PDF ou EPUB<input id="sourceFile" type="file" accept="application/pdf,application/epub+zip,.pdf,.epub"></label>
          </div>
          <div class="comic-grid">
            <article class="comic-card" id="openCurrentComic" tabindex="0">
              <div class="cover-preview"><canvas id="coverCanvas"></canvas><div id="epubCoverFallback">📚</div><span class="badge" id="formatBadge">PDF</span></div>
              <div class="comic-info"><h2 id="libraryTitle">Eternum – 01</h2><p id="librarySubtitle">Le sarcophage</p><div class="card-progress"><span id="cardProgressText">Chargement…</span><progress id="cardProgress" max="1" value="0"></progress></div></div>
            </article>
          </div>
        </section>

        <section id="bookmarksView" class="view"><div class="section-heading"><div><small>LECTURE</small><h1>Marque-pages</h1></div></div><div id="bookmarkList" class="bookmark-list"></div></section>
        <section id="settingsView" class="view"><div class="section-heading"><div><small>APPLICATION</small><h1>Paramètres</h1></div></div><div class="settings-card"><label><span>Thème</span><select id="themeSelect"><option value="dark">Sombre</option><option value="black">Noir profond</option></select></label><label><span>Sens de navigation</span><select id="directionSelect"><option value="ltr">Gauche vers droite</option><option value="rtl">Droite vers gauche</option></select></label><label><span>Masquage automatique</span><select id="autoHideSelect"><option value="on">Activé</option><option value="off">Désactivé</option></select></label><button id="resetProgressButton" type="button">Réinitialiser la progression</button></div></section>
      </main>
    </div>
  </div>

  <nav class="mobile-nav reader-chrome" aria-label="Navigation mobile">
    <button class="nav-item active" data-view="reader">◉<span>Lecture</span></button>
    <button class="nav-item" data-view="library">▦<span>Bibliothèque</span></button>
    <button class="nav-item" data-view="bookmarks">♡<span>Marque-pages</span></button>
    <button class="nav-item" data-view="settings">⚙<span>Paramètres</span></button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
  <script src="app.js" type="module"></script>
  <script src="fit-width-fix.js"></script>
</body>
</html>
